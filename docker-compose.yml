services:
  ollama:
    image: ollama/ollama
    ports:
      - "11435:11434"   # 11435 để không đụng Ollama đang chạy trên Windows
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    # GPU NVIDIA (bỏ comment nếu máy có card NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Chạy một lần để tải model, xong thì tự thoát
  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:7b}"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    volumes:
      - ./backend/src:/app/backend/src
      - ./mcp-weather/src:/app/mcp-weather/src
##new
      - ./mcp-calendar/src:/app/mcp-calendar/src

volumes:
  ollama_data: